name: Android API 19 build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Current Android command-line tools require JDK 17.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 28
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"
      # AGP 3.5.4 / Gradle 5.6.4 are intentionally kept on JDK 8.
      - name: Switch to JDK 8 for legacy Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 5.6.4
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-duel-api19-debug
          path: app/build/outputs/apk/debug/app-debug.apk
